openapi: 3.0.3
info:
  title: Pivot Banking System - Authentication Microservice API
  description: |
    Reactive Authentication & Authorization Microservice (`pivot-ms-auth`) issuing HS256 JWT tokens
    signed with secrets managed in HashiCorp Vault (`secret/pivot-bank`).
    Completely autonomous with zero outbound REST calls to other microservices.
  version: 1.0.0
servers:
  - url: http://localhost:8085/api/v1
    description: Local Development Server (ms-auth)

tags:
  - name: Authentication
    description: User registration, login, and JWT token issuance/validation

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account and issue a JWT token
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and JWT token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user credentials and issue a JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials or inactive user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/validate:
    get:
      tags:
        - Authentication
      summary: Validate a Bearer JWT token and inspect its claims
      operationId: validateToken
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer JWT token (`Bearer <token>`)
          schema:
            type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
        '401':
          description: Token is missing, expired, or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Role:
      type: string
      enum:
        - ROLE_USER
        - ROLE_ADMIN
      default: ROLE_USER

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 50
          example: daniel.singer
        email:
          type: string
          format: email
          example: daniel.singer@pivotbank.pe
        password:
          type: string
          minLength: 8
          example: PivotBank2026!
        role:
          $ref: '#/components/schemas/Role'
        customerId:
          type: string
          description: Optional reference to a bank customer ID

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: daniel.singer
        password:
          type: string
          example: PivotBank2026!

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInMs:
          type: integer
          format: int64
          example: 3600000
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        issuedAt:
          type: string
          format: date-time

    TokenValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expiresAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string